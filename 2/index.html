<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#080808">
  <link rel="manifest" href="manifest.json">
  <title>Rooster Rumble 2.0</title>
  <style>
    :root {
      --ui-bg: rgba(6, 6, 6, .72);
      --ui-border: rgba(255, 255, 255, .28);
      --ui-text: #f6f1df;
      --danger: #ff4d4d;
      --gold: #ffd24a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--ui-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    button { font: inherit; color: inherit; }
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      image-rendering: pixelated;
    }
    #hud {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 16px);
      padding: 7px 10px;
      border: 1px solid var(--ui-border);
      border-radius: 10px;
      background: var(--ui-bg);
      backdrop-filter: blur(6px);
      font-size: 12px;
      white-space: nowrap;
    }
    .hud-chip { display: inline-flex; align-items: center; gap: 4px; }
    #healthBar {
      width: 70px;
      height: 8px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }
    #healthFill { height: 100%; width: 100%; background: #64d96b; }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      z-index: 7;
      opacity: .75;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 5px #000;
    }
    #crosshair::before { width: 2px; height: 18px; left: 8px; top: 0; }
    #crosshair::after { height: 2px; width: 18px; left: 0; top: 8px; }
    .control {
      position: fixed;
      z-index: 12;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(20,20,20,.34);
      box-shadow: inset 0 0 24px rgba(255,255,255,.04);
      -webkit-tap-highlight-color: transparent;
    }
    .control:active { background: rgba(255,255,255,.18); transform: scale(.97); }
    #joystick {
      left: max(18px, env(safe-area-inset-left));
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      width: 112px;
      height: 112px;
      border-radius: 50%;
    }
    #joystickKnob {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.65);
      background: rgba(255,255,255,.16);
      pointer-events: none;
    }
    #shootBtn {
      right: max(18px, env(safe-area-inset-right));
      bottom: max(70px, calc(env(safe-area-inset-bottom) + 60px));
      width: 76px;
      height: 76px;
      border-radius: 50%;
      font-size: 40px;
    }
    #interactBtn, #swapBtn, #strafeLeftBtn, #strafeRightBtn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      font-size: 25px;
    }
    #interactBtn { right: max(106px, calc(env(safe-area-inset-right) + 106px)); bottom: max(86px, calc(env(safe-area-inset-bottom) + 76px)); }
    #swapBtn { right: max(106px, calc(env(safe-area-inset-right) + 106px)); bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px)); }
    #strafeLeftBtn { right: max(70px, calc(env(safe-area-inset-right) + 70px)); bottom: max(8px, calc(env(safe-area-inset-bottom) - 2px)); transform: translateX(-56px); }
    #strafeRightBtn { right: max(18px, env(safe-area-inset-right)); bottom: max(8px, calc(env(safe-area-inset-bottom) - 2px)); }
    #desktopHint {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 8;
      font-size: 10px;
      opacity: .55;
      pointer-events: none;
    }
    .screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, rgba(110,0,0,.32), transparent 38%), linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.94));
    }
    .panel {
      width: min(620px, 100%);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      background: rgba(10,10,10,.88);
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    .panel h1 { margin: 0 0 8px; font-size: clamp(34px, 8vw, 68px); line-height: .95; letter-spacing: -4px; }
    .panel .sub { margin: 10px 0 22px; color: #d6c6ad; font-size: 13px; line-height: 1.5; }
    .bigChicken { font-size: 72px; margin: 10px 0; filter: drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
    .primary {
      min-width: 180px;
      padding: 14px 22px;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 12px;
      background: #f4efe1;
      color: #121212;
      font-weight: 800;
      cursor: pointer;
    }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 18px 0; text-align: left; }
    .stat { padding: 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); font-size: 12px; }
    #toast {
      position: fixed;
      left: 50%;
      top: 18%;
      z-index: 20;
      transform: translateX(-50%);
      padding: 9px 12px;
      border-radius: 9px;
      background: rgba(0,0,0,.75);
      border: 1px solid rgba(255,255,255,.2);
      font-size: 12px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    #levelBanner {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-size: clamp(28px, 7vw, 72px);
      font-weight: 900;
      text-shadow: 0 4px 18px #000;
      opacity: 0;
    }
    @media (pointer: fine) and (min-width: 900px) { #joystick, #shootBtn, #interactBtn, #swapBtn, #strafeLeftBtn, #strafeRightBtn { opacity: .16; } }
    @media (max-width: 680px) {
      #hud { gap: 6px; font-size: 10px; padding: 6px 8px; }
      #hud .optional { display: none; }
      #desktopHint { display: none; }
      #joystick { width: 96px; height: 96px; }
      #joystickKnob { width: 42px; height: 42px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <span class="hud-chip">L<span id="hudLevel">1</span></span>
    <span class="hud-chip">❤️ <span id="hudHP">10</span></span>
    <span id="healthBar"><span id="healthFill"></span></span>
    <span class="hud-chip">🔫 <span id="hudWeapon">🍗</span></span>
    <span class="hud-chip">🐓 <span id="hudEnemies">0</span></span>
    <span class="hud-chip optional">🏆 <span id="hudScore">0</span></span>
    <span class="hud-chip optional">⏱ <span id="hudTime">0:00</span></span>
  </div>
  <div id="crosshair"></div>
  <div id="joystick" class="control"><div id="joystickKnob"></div></div>
  <button id="shootBtn" class="control" aria-label="Shoot">🍗</button>
  <button id="interactBtn" class="control" aria-label="Open door">🚪</button>
  <button id="swapBtn" class="control" aria-label="Swap weapon">🔄</button>
  <button id="strafeLeftBtn" class="control" aria-label="Strafe left">↙</button>
  <button id="strafeRightBtn" class="control" aria-label="Strafe right">↘</button>
  <div id="toast"></div>
  <div id="levelBanner"></div>
  <div id="desktopHint">W/S move · A/D turn · Z/X strafe · Space fire · E door · Q weapon</div>
  <div id="startScreen" class="screen">
    <div class="panel">
      <div class="bigChicken">🐓</div>
      <h1>ROOSTER<br>RUMBLE 2.0</h1>
      <p class="sub">A deeply serious pseudo-3D combat simulation involving poultry, ghosts, and weaponized lunch.</p>
      <button id="startBtn" class="primary">BEGIN THE RUMBLE</button>
    </div>
  </div>
  <div id="endScreen" class="screen" style="display:none">
    <div class="panel">
      <div id="endEmoji" class="bigChicken">💀</div>
      <h1 id="endTitle">GAME OVER</h1>
      <p id="endMessage" class="sub"></p>
      <div class="stats">
        <div class="stat">Score<br><strong id="endScore">0</strong></div>
        <div class="stat">Time<br><strong id="endTime">0:00</strong></div>
        <div class="stat">Kills<br><strong id="endKills">0</strong></div>
        <div class="stat">Best<br><strong id="endBest">0</strong></div>
      </div>
      <button id="restartBtn" class="primary">RUMBLE AGAIN</button>
    </div>
  </div>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = {
      level: document.getElementById('hudLevel'), hp: document.getElementById('hudHP'), healthFill: document.getElementById('healthFill'),
      weapon: document.getElementById('hudWeapon'), enemies: document.getElementById('hudEnemies'), score: document.getElementById('hudScore'), time: document.getElementById('hudTime')
    };
    const startScreen = document.getElementById('startScreen'), endScreen = document.getElementById('endScreen');
    const endTitle = document.getElementById('endTitle'), endEmoji = document.getElementById('endEmoji'), endMessage = document.getElementById('endMessage');
    const endScore = document.getElementById('endScore'), endTime = document.getElementById('endTime'), endKills = document.getElementById('endKills'), endBest = document.getElementById('endBest');
    const toastEl = document.getElementById('toast'), levelBanner = document.getElementById('levelBanner');
    const joystick = document.getElementById('joystick'), joystickKnob = document.getElementById('joystickKnob');
    const shootBtn = document.getElementById('shootBtn'), interactBtn = document.getElementById('interactBtn'), swapBtn = document.getElementById('swapBtn');
    const strafeLeftBtn = document.getElementById('strafeLeftBtn'), strafeRightBtn = document.getElementById('strafeRightBtn');
    const TAU = Math.PI * 2, FOV = Math.PI / 3, PLAYER_RADIUS = 0.20, MAX_HP = 15;
    const keys = Object.create(null), emojiCache = new Map();
    let zBuffer = new Float32Array(1);
    const WEAPONS = {
      '🍗': { name: 'Wing Blaster', cooldown: 0.28, speed: 8.5, damage: 1, size: 0.28, shake: 2.5 },
      '🪨': { name: 'Rock Lobber', cooldown: 0.58, speed: 6.0, damage: 2, size: 0.34, shake: 4.5 },
      '🗡️': { name: 'Dagger Yeeter', cooldown: 0.40, speed: 11.0, damage: 2, size: 0.30, shake: 3.5 }
    };
    const LEVELS = [
      { name: 'THE COOP', map: [
        '###############','#P....R....K.E#','#.............#','#..#####d####.#','#..#.........##','#..#..G..H....#','#..#..........#','#..######d#####','#.......R.....#','###############'
      ]},
      { name: 'FOWL PLAY', map: [
        '######################','#P....#......R......E#','#.....#..............#','#..G..d......#####d###','#.....#......#.......#','###d###..K...#..R....#','#..........###.......#','#..R....H....d...G...#','#...........###......#','######################'
      ]},
      { name: 'THE HAUNTED HENHOUSE', map: [
        '###########################','#P......#......G........E##','#.......#...............###','#..R....d....######d########','#.......#....#...........##','####d####....#....G......##','#............#...........##','#..K.....R...d.....D.....##','#............#...........##','######d############d########','#....G..........R.........#','###########################'
      ]},
      { name: 'TURKEY TERRITORY', map: [
        '############################','#P......#.................E#','#.......#................###','#..T....d....R.....G.......#','#.......#..................#','####d#########d#############','#.............#............#','#..R.....H....d.....T......#','#.............#............#','#####d#########d############','#....G.....D........R......#','############################'
      ]},
      { name: 'THE BIG CLUCK', map: [
        '##############################','#P...........#..............E#','#............#.............###','#..R....G....d.....T.........#','#............#...............#','#####d###############d########','#............................#','#....H.....R.............G...#','#............................#','########d############d########','#.............B..............#','#.....K..............D.......#','#............................#','##############################'
      ]}
    ];
    let levelIndex = 0, levelData = [], width = 0, height = 0, exitTile = null, enemies = [], projectiles = [], particles = [], pickups = [], doorStates = new Map();
    const player = { x: 1.5, y: 1.5, angle: 0, hp: 10, weapon: '🍗', inventory: ['🍗'], cooldown: 0 };
    const state = { running:false, finished:false, won:false, score:0, kills:0, campaignStart:0, elapsedBeforePause:0, lastFrame:performance.now(), screenShake:0, damageFlash:0, muzzleFlash:0, transitionLock:0 };
    let audioCtx = null;
    function ensureAudio(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }
    function tone(freq=220,duration=.06,type='square',volume=.025,slide=0){ if(!audioCtx)return; const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain(); osc.type=type; osc.frequency.setValueAtTime(freq,now); if(slide)osc.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),now+duration); gain.gain.setValueAtTime(volume,now); gain.gain.exponentialRampToValueAtTime(.0001,now+duration); osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+duration); }
    function sfx(name){ if(!audioCtx)return; if(name==='shoot')tone(130,.05,'square',.035,-40); if(name==='rock')tone(80,.09,'sawtooth',.04,-25); if(name==='dagger')tone(420,.04,'triangle',.025,220); if(name==='hit')tone(95,.05,'square',.035,35); if(name==='hurt')tone(65,.10,'sawtooth',.045,-20); if(name==='door')tone(115,.16,'square',.025,-55); if(name==='pickup'){tone(520,.05,'square',.025,120);setTimeout(()=>tone(720,.07,'square',.02,160),50);} if(name==='kill')tone(180,.06,'square',.03,120); if(name==='win'){tone(440,.10,'square',.03,80);setTimeout(()=>tone(660,.12,'square',.03,100),110);} }
    function resizeCanvas(){ const dpr=Math.min(window.devicePixelRatio||1,1.5); canvas.width=Math.max(320,Math.floor(innerWidth*dpr)); canvas.height=Math.max(240,Math.floor(innerHeight*dpr)); zBuffer=new Float32Array(canvas.width); }
    addEventListener('resize',resizeCanvas,{passive:true}); resizeCanvas();
    function formatTime(ms){ const total=Math.max(0,Math.floor(ms/1000)),m=Math.floor(total/60),s=total%60; return `${m}:${String(s).padStart(2,'0')}`; }
    function currentElapsed(){ return state.running ? state.elapsedBeforePause+(performance.now()-state.campaignStart) : state.elapsedBeforePause; }
    let toastTimer=0;
    function toast(text,duration=1200){ toastEl.textContent=text; toastEl.style.opacity='1'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.style.opacity='0',duration); }
    function banner(text){ levelBanner.textContent=text; levelBanner.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.08)'}],{duration:1300,easing:'ease-out'}); }
    function validateLevels(){ for(const [i,level] of LEVELS.entries()){ const w=level.map[0].length; if(!level.map.every(r=>r.length===w)) throw new Error(`Level ${i+1} has inconsistent row widths.`); } }
    validateLevels();
    function makeEnemy(type,x,y){ const base={type,x,y,vx:0,vy:0,aiTimer:Math.random()*.4,fireTimer:.5+Math.random()*1.5,wanderAngle:Math.random()*TAU,hitFlash:0}; if(type==='R')return{...base,emoji:'🐓',hp:1,maxHp:1,speed:1.35,fireRate:2.4,projectile:'🔥',points:100,touchDamage:1}; if(type==='G')return{...base,emoji:'👻',hp:2,maxHp:2,speed:2.15,fireRate:1.35,projectile:'💥',points:250,touchDamage:1}; if(type==='T')return{...base,emoji:'🦃',hp:4,maxHp:4,speed:.85,fireRate:1.9,projectile:'💣',points:450,touchDamage:2}; return{...base,emoji:'🦅',hp:12,maxHp:12,speed:1.1,fireRate:.85,projectile:'⚡',points:1500,touchDamage:2}; }
    function loadLevel(index,resetCampaign=false){ levelIndex=index; const level=LEVELS[index]; width=level.map[0].length; height=level.map.length; levelData=Array.from({length:height},()=>Array(width).fill(0)); enemies=[];projectiles=[];particles=[];pickups=[];doorStates=new Map();exitTile=null; if(resetCampaign){player.hp=10;player.weapon='🍗';player.inventory=['🍗'];state.score=0;state.kills=0;} for(let y=0;y<height;y++){ for(let x=0;x<width;x++){ const ch=level.map[y][x]; if(ch==='#')levelData[y][x]=1; else if(ch==='d')levelData[y][x]=2; else { levelData[y][x]=0; if(ch==='P'){player.x=x+.5;player.y=y+.5;player.angle=0;} else if('RGTB'.includes(ch))enemies.push(makeEnemy(ch,x+.5,y+.5)); else if(ch==='K')pickups.push({x:x+.5,y:y+.5,type:'rock',emoji:'🪨'}); else if(ch==='D')pickups.push({x:x+.5,y:y+.5,type:'dagger',emoji:'🗡️'}); else if(ch==='H')pickups.push({x:x+.5,y:y+.5,type:'health',emoji:'❤️'}); else if(ch==='E')exitTile={x:x+.5,y:y+.5}; } } } player.cooldown=0; state.transitionLock=1; banner(`LEVEL ${index+1}: ${level.name}`); updateHUD(); }
    function cellAt(x,y){ const mx=Math.floor(x),my=Math.floor(y); if(mx<0||my<0||mx>=width||my>=height)return 1; return levelData[my][mx]; }
    function solidAt(x,y){ const c=cellAt(x,y); return c===1||c===2; }
    function canOccupy(x,y,r=PLAYER_RADIUS){ return !solidAt(x-r,y-r)&&!solidAt(x+r,y-r)&&!solidAt(x-r,y+r)&&!solidAt(x+r,y+r); }
    function lineOfSight(x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/.12)); for(let i=1;i<steps;i++){ const t=i/steps; if(solidAt(x1+dx*t,y1+dy*t))return false; } return true; }
    function nearestPathStep(enemy,tx,ty){ const sx=Math.floor(enemy.x),sy=Math.floor(enemy.y),gx=Math.floor(tx),gy=Math.floor(ty); if(sx===gx&&sy===gy)return null; const q=[[sx,sy]],seen=new Set([`${sx},${sy}`]),parent=new Map(),dirs=[[1,0],[-1,0],[0,1],[0,-1]]; let found=null,processed=0; while(q.length&&processed<700){ processed++; const [x,y]=q.shift(); if(x===gx&&y===gy){found=[x,y];break;} for(const [dx,dy] of dirs){ const nx=x+dx,ny=y+dy,key=`${nx},${ny}`; if(seen.has(key)||nx<0||ny<0||nx>=width||ny>=height)continue; const cell=levelData[ny][nx]; if(cell===1||cell===2)continue; seen.add(key);parent.set(key,[x,y]);q.push([nx,ny]); } } if(!found)return null; let cur=found,prev=parent.get(`${cur[0]},${cur[1]}`); while(prev&&!(prev[0]===sx&&prev[1]===sy)){cur=prev;prev=parent.get(`${cur[0]},${cur[1]}`);} return{x:cur[0]+.5,y:cur[1]+.5}; }
    function openDoor(){ const dist=.85,tx=player.x+Math.sin(player.angle)*dist,ty=player.y-Math.cos(player.angle)*dist,mx=Math.floor(tx),my=Math.floor(ty); if(mx<0||my<0||mx>=width||my>=height)return; if(levelData[my][mx]===2){const key=`${mx},${my}`;if(!doorStates.has(key)){doorStates.set(key,0);sfx('door');toast('Door opening…');}} }
    function updateDoors(dt){ for(const [key,progress] of [...doorStates.entries()]){ const next=progress+dt*1.35; if(next>=1){const [x,y]=key.split(',').map(Number);levelData[y][x]=0;doorStates.delete(key);} else doorStates.set(key,next); } }
    function swapWeapon(){ if(player.inventory.length<=1)return; const i=player.inventory.indexOf(player.weapon); player.weapon=player.inventory[(i+1)%player.inventory.length]; shootBtn.textContent=player.weapon; toast(WEAPONS[player.weapon].name); tone(320,.035,'square',.02,90); }
    function spawnParticles(x,y,kind='impact',count=22){ const palette=kind==='ghost'?['255,0,70','180,0,255']:kind==='boss'?['255,210,0','255,80,0']:['255,185,60','255,75,40','240,240,220']; for(let i=0;i<count;i++){const a=Math.random()*TAU,speed=.5+Math.random()*2.6;particles.push({x,y,z:(Math.random()-.2)*.25,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,vz:(Math.random()-.35)*2.2,life:.25+Math.random()*.55,maxLife:.8,color:palette[(Math.random()*palette.length)|0]});} }
    function shoot(){ if(!state.running||state.finished||player.cooldown>0||state.transitionLock>0)return; ensureAudio(); const w=WEAPONS[player.weapon]; player.cooldown=w.cooldown; state.screenShake=Math.max(state.screenShake,w.shake); state.muzzleFlash=.06; const dirX=Math.sin(player.angle),dirY=-Math.cos(player.angle),sideX=Math.cos(player.angle),sideY=Math.sin(player.angle); projectiles.push({owner:'player',x:player.x+dirX*.30+sideX*.02,y:player.y+dirY*.30+sideY*.02,dx:dirX*w.speed,dy:dirY*w.speed,emoji:player.weapon,damage:w.damage,size:w.size,life:2.4}); sfx(player.weapon==='🪨'?'rock':player.weapon==='🗡️'?'dagger':'shoot'); }
    function enemyShoot(enemy){ if(!lineOfSight(enemy.x,enemy.y,player.x,player.y))return; const dx=player.x-enemy.x,dy=player.y-enemy.y,d=Math.max(.001,Math.hypot(dx,dy)); const speed=enemy.type==='T'?3.2:enemy.type==='B'?5.2:4.1,damage=enemy.type==='T'||enemy.type==='B'?2:1; projectiles.push({owner:'enemy',x:enemy.x,y:enemy.y,dx:dx/d*speed,dy:dy/d*speed,emoji:enemy.projectile,damage,size:enemy.type==='B'?.34:.24,life:4}); }

    function updateProjectiles(dt){ for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i],speed=Math.hypot(p.dx,p.dy),steps=Math.max(1,Math.ceil(speed*dt/.12));let removed=false;for(let s=0;s<steps&&!removed;s++){p.x+=p.dx*dt/steps;p.y+=p.dy*dt/steps;if(solidAt(p.x,p.y)){spawnParticles(p.x,p.y,'impact',12);projectiles.splice(i,1);removed=true;break;}if(p.owner==='player'){for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(e.x-p.x,e.y-p.y)<.42){e.hp-=p.damage;e.hitFlash=.10;spawnParticles(p.x,p.y,e.type==='G'?'ghost':'impact',14);sfx('hit');if(e.hp<=0)killEnemy(e,j);projectiles.splice(i,1);removed=true;break;}}}else if(Math.hypot(player.x-p.x,player.y-p.y)<.34){damagePlayer(p.damage);spawnParticles(p.x,p.y,'impact',18);projectiles.splice(i,1);removed=true;}}if(!removed){p.life-=dt;if(p.life<=0)projectiles.splice(i,1);}} }
    function updateEnemies(dt){ for(const enemy of enemies){enemy.fireTimer-=dt;enemy.aiTimer-=dt;enemy.hitFlash=Math.max(0,enemy.hitFlash-dt);const dx=player.x-enemy.x,dy=player.y-enemy.y,dist=Math.max(.001,Math.hypot(dx,dy)),sees=dist<11&&lineOfSight(enemy.x,enemy.y,player.x,player.y);let targetX=enemy.x,targetY=enemy.y;if(enemy.type==='G'||enemy.type==='B'){if(enemy.aiTimer<=0){enemy.aiTimer=enemy.type==='B'?.28:.38;enemy.pathTarget=nearestPathStep(enemy,player.x,player.y);}if(enemy.pathTarget){targetX=enemy.pathTarget.x;targetY=enemy.pathTarget.y;}else if(sees){targetX=player.x;targetY=player.y;}}else if(sees){const desired=enemy.type==='T'?4.5:3.6,toward=dist>desired?1:dist<desired-.7?-1:0,strafe=Math.sin(performance.now()*.0016+enemy.x*2.7)*.55;targetX=enemy.x+(dx/dist)*toward+(-dy/dist)*strafe;targetY=enemy.y+(dy/dist)*toward+(dx/dist)*strafe;}else{if(enemy.aiTimer<=0){enemy.aiTimer=1+Math.random()*1.5;enemy.wanderAngle+=(Math.random()-.5)*2.4;}targetX=enemy.x+Math.cos(enemy.wanderAngle);targetY=enemy.y+Math.sin(enemy.wanderAngle);}let mdx=targetX-enemy.x,mdy=targetY-enemy.y,md=Math.hypot(mdx,mdy);if(md>.03){mdx/=md;mdy/=md;const step=enemy.speed*dt,nx=enemy.x+mdx*step,ny=enemy.y+mdy*step;if(canOccupy(nx,enemy.y,.18))enemy.x=nx;else enemy.wanderAngle+=1.2;if(canOccupy(enemy.x,ny,.18))enemy.y=ny;else enemy.wanderAngle-=.8;}if(sees&&enemy.fireTimer<=0){enemy.fireTimer=enemy.fireRate*(.82+Math.random()*.36);enemyShoot(enemy);}if(dist<.52){enemy.touchTimer=(enemy.touchTimer||0)-dt;if(enemy.touchTimer<=0){enemy.touchTimer=.75;damagePlayer(enemy.touchDamage);}}} }
    function updatePickups(){ for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];if(Math.hypot(player.x-p.x,player.y-p.y)>.48)continue;if(p.type==='health'){if(player.hp>=MAX_HP)continue;player.hp=Math.min(MAX_HP,player.hp+5);state.score+=25;toast('+5 HP');}else{const emoji=p.type==='rock'?'🪨':'🗡️';if(!player.inventory.includes(emoji))player.inventory.push(emoji);player.weapon=emoji;state.score+=50;toast(`${WEAPONS[emoji].name} acquired`);}pickups.splice(i,1);sfx('pickup');} }
    function updateParticles(dt){ for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.vz-=1.2*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);} }
    function getEmojiTexture(char){ if(emojiCache.has(char))return emojiCache.get(char);const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.clearRect(0,0,256,256);g.textAlign='center';g.textBaseline='middle';g.font='200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';g.fillText(char,128,132);emojiCache.set(char,c);return c; }
    function projectWorld(wx,wy,planeX,planeY,dirX,dirY){const dx=wx-player.x,dy=wy-player.y,invDet=1/(planeX*dirY-dirX*planeY),transformX=invDet*(dirY*dx-dirX*dy),transformY=invDet*(-planeY*dx+planeX*dy);if(transformY<=.03)return null;return{depth:transformY,screenX:(canvas.width/2)*(1+transformX/transformY)};}

    function renderWalls(dirX,dirY,planeX,planeY){const w=canvas.width,h=canvas.height,sky=ctx.createLinearGradient(0,0,0,h/2);sky.addColorStop(0,'#09131f');sky.addColorStop(1,'#16354a');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h/2);const floor=ctx.createLinearGradient(0,h/2,0,h);floor.addColorStop(0,'#34302b');floor.addColorStop(1,'#11100f');ctx.fillStyle=floor;ctx.fillRect(0,h/2,w,h/2);for(let x=0;x<w;x++){const cameraX=2*x/w-1,rayDirX=dirX+planeX*cameraX,rayDirY=dirY+planeY*cameraX;let mapX=Math.floor(player.x),mapY=Math.floor(player.y);const deltaX=rayDirX===0?1e30:Math.abs(1/rayDirX),deltaY=rayDirY===0?1e30:Math.abs(1/rayDirY);let stepX,stepY,sideX,sideY;if(rayDirX<0){stepX=-1;sideX=(player.x-mapX)*deltaX;}else{stepX=1;sideX=(mapX+1-player.x)*deltaX;}if(rayDirY<0){stepY=-1;sideY=(player.y-mapY)*deltaY;}else{stepY=1;sideY=(mapY+1-player.y)*deltaY;}let side=0,cell=1;while(true){if(sideX<sideY){sideX+=deltaX;mapX+=stepX;side=0;}else{sideY+=deltaY;mapY+=stepY;side=1;}if(mapX<0||mapY<0||mapX>=width||mapY>=height){cell=1;break;}cell=levelData[mapY][mapX];if(cell===1||cell===2)break;}let dist=side===0?sideX-deltaX:sideY-deltaY;dist=Math.max(.02,dist);zBuffer[x]=dist;const lineH=Math.min(h*5,Math.floor(h/dist));let top=Math.floor(h/2-lineH/2),bottom=Math.floor(h/2+lineH/2),shade=Math.max(.18,1-dist/16);if(side===1)shade*=.72;if(cell===2){const progress=doorStates.get(`${mapX},${mapY}`)||0,lift=progress*lineH;top-=lift;bottom-=lift;const r=Math.floor(118*shade),g=Math.floor(70*shade),b=Math.floor(38*shade);ctx.fillStyle=`rgb(${r},${g},${b})`;}else{const brick=((mapX+mapY)&1)?1:.86,c=Math.floor(190*shade*brick),warm=Math.floor(160*shade*brick);ctx.fillStyle=`rgb(${c},${warm},${Math.floor(warm*.78)})`;}ctx.fillRect(x,Math.max(-h,top),1,Math.min(h*2,bottom-top+1));if(dist<8&&x%3===0){ctx.fillStyle=`rgba(0,0,0,${Math.min(.22,dist*.012)})`;ctx.fillRect(x,Math.max(0,top),1,Math.min(h,bottom)-Math.max(0,top));}}}
    function renderScene(){const w=canvas.width,h=canvas.height,dirX=Math.sin(player.angle),dirY=-Math.cos(player.angle),planeLen=Math.tan(FOV/2),planeX=-dirY*planeLen,planeY=dirX*planeLen;ctx.save();if(state.screenShake>.1)ctx.translate((Math.random()-.5)*state.screenShake,(Math.random()-.5)*state.screenShake);renderWalls(dirX,dirY,planeX,planeY);const sprites=[];for(const e of enemies)sprites.push({depth:Math.hypot(e.x-player.x,e.y-player.y),kind:'enemy',ref:e});for(const p of pickups)sprites.push({depth:Math.hypot(p.x-player.x,p.y-player.y),kind:'pickup',ref:p});for(const p of projectiles)sprites.push({depth:Math.hypot(p.x-player.x,p.y-player.y),kind:'projectile',ref:p});if(exitTile)sprites.push({depth:Math.hypot(exitTile.x-player.x,exitTile.y-player.y),kind:'exit',ref:exitTile});sprites.sort((a,b)=>b.depth-a.depth);for(const item of sprites){if(item.kind==='enemy'){const e=item.ref,alpha=e.hitFlash>0?.62:1,scale=e.type==='B'?1.22:e.type==='T'?.90:.78;drawEmojiSprite(e.emoji,e.x,e.y,scale,0,planeX,planeY,dirX,dirY,alpha);if(e.hp<e.maxHp){const p=projectWorld(e.x,e.y,planeX,planeY,dirX,dirY);if(p&&p.depth<8){const barW=Math.min(90,50/p.depth*2.5),sy=h/2-(h/p.depth)*scale*.58;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(p.screenX-barW/2,sy,barW,5);ctx.fillStyle='#ff4d4d';ctx.fillRect(p.screenX-barW/2,sy,barW*(e.hp/e.maxHp),5);}}}else if(item.kind==='pickup'){const p=item.ref;drawEmojiSprite(p.emoji,p.x,p.y,.34,-.18,planeX,planeY,dirX,dirY);}else if(item.kind==='projectile'){const p=item.ref;drawEmojiSprite(p.emoji,p.x,p.y,p.size,0,planeX,planeY,dirX,dirY);}else{const open=enemies.length===0;drawEmojiSprite(open?'🌀':'🔒',item.ref.x,item.ref.y,.58,0,planeX,planeY,dirX,dirY,open?1:.82);}}for(const p of particles){const pr=projectWorld(p.x,p.y,planeX,planeY,dirX,dirY);if(!pr||pr.screenX<0||pr.screenX>=w)continue;const sx=pr.screenX|0;if(pr.depth>=zBuffer[sx])continue;const size=Math.max(1,Math.min(8,14/pr.depth)),sy=h/2-p.z*(h/pr.depth);ctx.fillStyle=`rgba(${p.color},${     function updateHUD(){hud.level.textContent=levelIndex+1;hud.hp.textContent=player.hp;hud.weapon.textContent=player.weapon;hud.enemies.textContent=enemies.length;hud.score.textContent=state.score;hud.time.textContent=formatTime(currentElapsed());const hpPct=Math.max(0,Math.min(100,player.hp/MAX_HP*100));hud.healthFill.style.width=`${hpPct}%`;hud.healthFill.style.background=hpPct<30?'#ff4d4d':hpPct<60?'#ffd24a':'#64d96b';shootBtn.textContent=player.weapon;}
    const input={move:0,turn:0,strafe:0,joystickActive:false,joystickPointer:null,leftHeld:false,rightHeld:false};
    function pollGamepad(){const pads=navigator.getGamepads?navigator.getGamepads():[],gp=pads&&[...pads].find(Boolean);if(!gp)return null;const dead=.14;return{move:Math.abs(gp.axes[1]||0)>dead?-(gp.axes[1]||0):0,turn:Math.abs(gp.axes[2]||gp.axes[0]||0)>dead?(gp.axes[2]||gp.axes[0]||0):0,strafe:Math.abs(gp.axes[0]||0)>dead&&Math.abs(gp.axes[2]||0)>dead?gp.axes[0]:0,fire:!!(gp.buttons[7]&&gp.buttons[7].value>.25)||!!(gp.buttons[0]&&gp.buttons[0].pressed),interact:!!(gp.buttons[1]&&gp.buttons[1].pressed),swap:!!(gp.buttons[3]&&gp.buttons[3].pressed)};}
    let gpLatch={interact:false,swap:false};
    function updatePlayer(dt){const gp=pollGamepad(),kbMove=(keys['w']||keys['ArrowUp']?1:0)-(keys['s']||keys['ArrowDown']?1:0),kbTurn=(keys['d']||keys['ArrowRight']?1:0)-(keys['a']||keys['ArrowLeft']?1:0),kbStrafe=(keys['x']?1:0)-(keys['z']?1:0);const move=Math.max(-1,Math.min(1,input.joystickActive?input.move:(gp?gp.move:kbMove))),turn=Math.max(-1,Math.min(1,input.joystickActive?input.turn:(gp?gp.turn:kbTurn)));let strafe=Math.max(-1,Math.min(1,kbStrafe+(input.leftHeld?-1:0)+(input.rightHeld?1:0)));if(gp&&gp.strafe)strafe=gp.strafe;if(gp&&gp.fire)shoot();if(gp&&gp.interact&&!gpLatch.interact)openDoor();if(gp&&gp.swap&&!gpLatch.swap)swapWeapon();gpLatch.interact=!!(gp&&gp.interact);gpLatch.swap=!!(gp&&gp.swap);player.angle=(player.angle+turn*2.25*dt+TAU)%TAU;const dirX=Math.sin(player.angle),dirY=-Math.cos(player.angle),sideX=Math.cos(player.angle),sideY=Math.sin(player.angle),speed=keys['Shift']?4:3;let vx=dirX*move*speed+sideX*strafe*2.65,vy=dirY*move*speed+sideY*strafe*2.65,mag=Math.hypot(vx,vy);if(mag>speed*1.2){vx=vx/mag*speed*1.2;vy=vy/mag*speed*1.2;}const nx=player.x+vx*dt,ny=player.y+vy*dt;if(canOccupy(nx,player.y))player.x=nx;if(canOccupy(player.x,ny))player.y=ny;player.cooldown=Math.max(0,player.cooldown-dt);}
    function checkExit(){if(!exitTile||enemies.length>0||state.transitionLock>0)return;if(Math.hypot(player.x-exitTile.x,player.y-exitTile.y)<.48){state.transitionLock=1.5;if(levelIndex>=LEVELS.length-1)finishGame(true);else{state.score+=500;loadLevel(levelIndex+1,false);sfx('pickup');}}}

    addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key===' ')shoot();if(e.key.toLowerCase()==='e')openDoor();if(e.key.toLowerCase()==='q')swapWeapon();});
