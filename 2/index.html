<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Rooster Rumble 2.0</title>
  <style>
    html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#080808;color:#f6f1df;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    #status{text-align:center;padding:24px}#bird{font-size:72px;margin-bottom:12px}#error{display:none;color:#ff7777;max-width:520px;line-height:1.5}
  </style>
</head>
<body>
  <div id="status"><div id="bird">🐓</div><div>LOADING THE RUMBLE…</div><div id="error"></div></div>
  <script>
    (async () => {
      try {
        const response = await fetch('./game-source.html?hotfix=1', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Source load failed (${response.status})`);
        let source = await response.text();
        source = source
          .replace("'#..R....d....######d########'", "'#..R....d....######d#######'")
          .replace("'######d############d########'", "'######d############d#######'");
        document.open();
        document.write(source);
        document.close();
      } catch (err) {
        const el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = `Could not start Rooster Rumble 2.0: ${err.message}`;
      }
    })();
  </script>
</body>
</html>
